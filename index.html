<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIDI Piano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --bg-color: #ffffff;
    --font-color: #222222;
    --white-key-color: #ffffff;
    --black-key-color: #222222;
    --active-key-color: #4a76c4;
    --highlight-color: #ffd54f;
    --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  body {
    margin: 0;
    font-family: var(--font-family);
    background: var(--bg-color);
    color: var(--font-color);
  }
  #topBar {
    position: relative;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    border-bottom: 1px solid #eee;
    flex-wrap: wrap;
  }
  #status {
    font-size: 13px;
    color: #666;
  }
  #status.connected { color: #2a7a2a; }
  #status.error { color: #b33; }
  #inputRow {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
  }
  select {
    font-size: 13px;
    padding: 4px 8px;
  }
  #settingsPanel input[type="number"] {
    font-size: 13px;
    padding: 4px 8px;
    width: 64px;
  }
  #settingsPanel input[type="color"] {
    width: 40px;
    height: 24px;
    padding: 2px;
    border: 1px solid #ddd;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
  }
  #menuButton {
    margin-left: auto;
    width: 32px;
    height: 32px;
    font-size: 18px;
    line-height: 1;
    background: none;
    border: 1px solid #ddd;
    border-radius: 4px;
    cursor: pointer;
    color: #333;
  }
  #menuButton:hover {
    background: #f5f5f5;
  }
  #settingsPanel {
    position: absolute;
    top: 100%;
    margin-top: 6px;
    right: 16px;
    width: 380px;
    max-width: calc(100vw - 32px);
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 10;
    font-size: 13px;
  }
  #settingsPanel[hidden] {
    display: none;
  }
  #settingsPanel label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  #settingsPanel h4 {
    margin: 6px 0 0;
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .level-control {
    display: flex;
    border: 1px solid #ddd;
    border-radius: 4px;
    overflow: hidden;
  }
  .level-btn {
    flex: 1;
    padding: 5px 0;
    font-size: 12px;
    border: none;
    background: #fff;
    cursor: pointer;
    color: #555;
  }
  .level-btn + .level-btn {
    border-left: 1px solid #ddd;
  }
  .level-btn:hover {
    background: #f5f5f5;
  }
  .level-btn.active {
    background: #4a76c4;
    color: #fff;
  }
  #chordsSection {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #chordsSection[hidden] {
    display: none;
  }
  #chordTableWrap {
    max-height: 320px;
    overflow-y: auto;
    border: 1px solid #eee;
    border-radius: 4px;
  }
  #chordTable {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  #chordTable th, #chordTable td {
    padding: 3px 5px;
    text-align: left;
    border-bottom: 1px solid #f2f2f2;
  }
  #chordTable th {
    position: sticky;
    top: 0;
    background: #fafafa;
    color: #888;
    font-weight: 500;
  }
  #chordTable td:first-child { width: 40%; }
  #chordTable input {
    width: 100%;
    box-sizing: border-box;
    font-size: 12px;
    padding: 2px 4px;
    border: 1px solid #ddd;
    border-radius: 3px;
  }
  #chordTable .chord-delete-btn {
    background: none;
    border: none;
    color: #b33;
    cursor: pointer;
    font-size: 13px;
    padding: 0 4px;
  }
  .chord-table-actions {
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .chord-table-actions button {
    font-size: 12px;
    padding: 5px 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
  }
  .chord-table-actions button:hover {
    background: #f5f5f5;
  }
  .chord-import-error {
    color: #b33;
    font-size: 12px;
  }
  .version-info {
    color: #bbb;
    font-size: 11px;
    text-align: right;
  }
  #chordDisplay {
    min-height: 90px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 8px 24px;
  }
  #chordDisplay .placeholder {
    color: #bbb;
    font-size: 14px;
  }
  #chordDisplay .chord-main {
    font-size: 40px;
    font-weight: 600;
    line-height: 1.1;
  }
  #chordDisplay .chord-roman {
    font-size: 16px;
    color: #666;
    margin-top: 2px;
  }
  #chordDisplay .chord-alt {
    font-size: 15px;
    color: #888;
    margin-top: 4px;
  }
  #pianoContainer {
    overflow-x: auto;
    padding: 0 16px 24px 16px;
  }
  svg#piano {
    display: block;
  }
  .white-key {
    fill: var(--white-key-color);
    stroke: #333;
    stroke-width: 1;
  }
  .white-key.active {
    fill: var(--active-key-color);
  }
  .black-key {
    fill: var(--black-key-color);
    stroke: #000;
    stroke-width: 1;
  }
  .black-key.active {
    fill: var(--active-key-color);
  }
  .note-label {
    font-size: 15px;
    fill: var(--font-color);
    text-anchor: middle;
    font-weight: 600;
  }
  .octave-label {
    font-size: 10px;
    fill: #999;
    text-anchor: middle;
  }
  .white-key.highlighted {
    fill: var(--highlight-color);
  }
  .black-key.highlighted {
    fill: color-mix(in srgb, var(--highlight-color) 55%, black);
  }
  .white-key.active.highlighted {
    fill: color-mix(in srgb, var(--active-key-color) 50%, var(--highlight-color));
  }
  .black-key.active.highlighted {
    fill: color-mix(in srgb, var(--active-key-color) 50%, color-mix(in srgb, var(--highlight-color) 55%, black));
  }
  #highlighterSection {
    margin: 0 16px 24px 16px;
    border: 1px solid #eee;
    border-radius: 6px;
  }
  #highlighterToggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: #fafafa;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: #333;
  }
  #highlighterToggle:hover {
    background: #f2f2f2;
  }
  #highlighterToggle .chevron {
    display: inline-block;
    transition: transform 0.15s ease;
    color: #999;
  }
  #highlighterToggle.open .chevron {
    transform: rotate(90deg);
  }
  #highlighterBody {
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    border-top: 1px solid #eee;
  }
  #highlighterBody[hidden] {
    display: none;
  }
  .highlighter-group h4 {
    margin: 0 0 8px;
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .root-buttons, .type-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .type-buttons {
    margin-top: 8px;
  }
  .root-btn, .type-btn {
    padding: 5px 10px;
    font-size: 13px;
    border: 1px solid #ddd;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
    color: #333;
  }
  .root-btn:hover, .type-btn:hover {
    background: #f5f5f5;
  }
  .root-btn.active, .type-btn.active {
    background: #4a76c4;
    border-color: #4a76c4;
    color: #fff;
  }
  #chordTypeSelect {
    margin-top: 8px;
  }
</style>
</head>
<body>
  <div id="topBar">
    <strong>MIDI Piano</strong>
    <span id="status">Checking for Web MIDI support&hellip;</span>
    <label for="inputSelect" id="inputRow" style="display:none;"><select id="inputSelect"></select></label>
    <button id="menuButton" type="button" aria-label="Settings" aria-haspopup="true" aria-expanded="false">&#9776;</button>
    <div id="settingsPanel" hidden>
      <div class="level-control" role="group" aria-label="Level">
        <button type="button" class="level-btn" data-level="basic">Basic</button>
        <button type="button" class="level-btn" data-level="intermediate">Intermediate</button>
        <button type="button" class="level-btn" data-level="nerd">Nerd</button>
      </div>

      <label for="rangeInput">Visible keys <input type="number" id="rangeInput" min="1" max="88" step="1"></label>
      <label for="keySelect">Key <select id="keySelect"></select></label>
      <label for="modeSelect"><span id="modeLabelText">Mode</span> <select id="modeSelect"></select></label>
      <label for="debugCheckbox">Debug <input type="checkbox" id="debugCheckbox"></label>

      <div id="themeSection">
        <h4>Theme</h4>
        <label for="fontFamilySelect">Font family <select id="fontFamilySelect"></select></label>
        <label for="themeBackgroundInput">Background <input type="color" id="themeBackgroundInput"></label>
        <label for="themeFontInput">Font <input type="color" id="themeFontInput"></label>
        <label for="themeWhiteKeyInput">White keys <input type="color" id="themeWhiteKeyInput"></label>
        <label for="themeBlackKeyInput">Black keys <input type="color" id="themeBlackKeyInput"></label>
        <label for="themeActiveKeyInput">Active key <input type="color" id="themeActiveKeyInput"></label>
        <label for="themeHighlightInput">Highlight <input type="color" id="themeHighlightInput"></label>
        <div class="chord-table-actions">
          <button id="themeResetBtn" type="button">Reset to defaults</button>
        </div>
      </div>

      <div id="chordsSection">
        <h4>Chords</h4>
        <div id="chordTableWrap">
          <table id="chordTable">
            <thead>
              <tr><th>Symbol</th><th>Intervals</th><th></th></tr>
            </thead>
            <tbody id="chordTableBody"></tbody>
          </table>
        </div>
        <div class="chord-table-actions">
          <button id="addChordBtn" type="button">+ Add chord</button>
          <button id="resetChordsBtn" type="button">Reset to defaults</button>
        </div>
        <div class="chord-table-actions">
          <button id="exportChordsBtn" type="button">Export&hellip;</button>
          <button id="importChordsBtn" type="button">Import&hellip;</button>
          <input id="importFileInput" type="file" accept="application/json" style="display:none;">
        </div>
        <div id="chordImportError" class="chord-import-error" hidden></div>
      </div>

      <div id="versionInfo" class="version-info"></div>
    </div>
  </div>

  <div id="chordDisplay">
    <span class="placeholder">Chord detection coming soon</span>
  </div>

  <div id="pianoContainer">
    <svg id="piano"></svg>
  </div>

  <div id="highlighterSection">
    <button id="highlighterToggle" type="button" aria-expanded="false" aria-controls="highlighterBody">
      Highlighter <span class="chevron">&#9656;</span>
    </button>
    <div id="highlighterBody" hidden>
      <div class="highlighter-group" data-kind="scale">
        <h4>Scale</h4>
        <div class="root-buttons" id="scaleRootButtons"></div>
        <div class="type-buttons" id="scaleTypeButtons"></div>
      </div>
      <div class="highlighter-group" data-kind="chord">
        <h4>Chord</h4>
        <div class="root-buttons" id="chordRootButtons"></div>
        <select id="chordTypeSelect"></select>
      </div>
    </div>
  </div>

<script src="app.js?v=535a9c6"></script>
</body>
</html>
