<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIDI Piano</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #ffffff;
    color: #222;
  }
  #topBar {
    position: relative;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    border-bottom: 1px solid #eee;
    flex-wrap: wrap;
  }
  #status {
    font-size: 13px;
    color: #666;
  }
  #status.connected { color: #2a7a2a; }
  #status.error { color: #b33; }
  #inputRow {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
  }
  select {
    font-size: 13px;
    padding: 4px 8px;
  }
  #menuButton {
    margin-left: auto;
    width: 32px;
    height: 32px;
    font-size: 18px;
    line-height: 1;
    background: none;
    border: 1px solid #ddd;
    border-radius: 4px;
    cursor: pointer;
    color: #333;
  }
  #menuButton:hover {
    background: #f5f5f5;
  }
  #settingsPanel {
    position: absolute;
    top: 100%;
    margin-top: 6px;
    right: 16px;
    width: 380px;
    max-width: calc(100vw - 32px);
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 10;
    font-size: 13px;
  }
  #settingsPanel[hidden] {
    display: none;
  }
  #settingsPanel label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  #settingsPanel h4 {
    margin: 6px 0 0;
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  #chordTableWrap {
    max-height: 320px;
    overflow-y: auto;
    border: 1px solid #eee;
    border-radius: 4px;
  }
  #chordTable {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  #chordTable th, #chordTable td {
    padding: 3px 5px;
    text-align: left;
    border-bottom: 1px solid #f2f2f2;
  }
  #chordTable th {
    position: sticky;
    top: 0;
    background: #fafafa;
    color: #888;
    font-weight: 500;
  }
  #chordTable td:first-child { width: 40%; }
  #chordTable input {
    width: 100%;
    box-sizing: border-box;
    font-size: 12px;
    padding: 2px 4px;
    border: 1px solid #ddd;
    border-radius: 3px;
  }
  #chordTable .chord-delete-btn {
    background: none;
    border: none;
    color: #b33;
    cursor: pointer;
    font-size: 13px;
    padding: 0 4px;
  }
  .chord-table-actions {
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .chord-table-actions button {
    font-size: 12px;
    padding: 5px 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
  }
  .chord-table-actions button:hover {
    background: #f5f5f5;
  }
  #chordDisplay {
    min-height: 90px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 8px 24px;
  }
  #chordDisplay .placeholder {
    color: #bbb;
    font-size: 14px;
  }
  #chordDisplay .chord-main {
    font-size: 40px;
    font-weight: 600;
    line-height: 1.1;
  }
  #chordDisplay .chord-alt {
    font-size: 15px;
    color: #888;
    margin-top: 4px;
  }
  #pianoContainer {
    overflow-x: auto;
    padding: 0 16px 24px 16px;
  }
  svg#piano {
    display: block;
  }
  .white-key {
    fill: #ffffff;
    stroke: #333;
    stroke-width: 1;
  }
  .white-key.active {
    fill: #a9c9f0;
  }
  .black-key {
    fill: #222222;
    stroke: #000;
    stroke-width: 1;
  }
  .black-key.active {
    fill: #4a76c4;
  }
  .note-label {
    font-size: 15px;
    fill: #333;
    text-anchor: middle;
    font-weight: 600;
  }
  .octave-label {
    font-size: 10px;
    fill: #999;
    text-anchor: middle;
  }
</style>
</head>
<body>
  <div id="topBar">
    <strong>MIDI Piano</strong>
    <span id="status">Checking for Web MIDI support&hellip;</span>
    <label for="inputSelect" id="inputRow" style="display:none;"><select id="inputSelect"></select></label>
    <button id="menuButton" type="button" aria-label="Settings" aria-haspopup="true" aria-expanded="false">&#9776;</button>
    <div id="settingsPanel" hidden>
      <label for="keySelect">Key <select id="keySelect"></select></label>

      <h4>Chords</h4>
      <div id="chordTableWrap">
        <table id="chordTable">
          <thead>
            <tr><th>Symbol</th><th>Intervals</th><th></th></tr>
          </thead>
          <tbody id="chordTableBody"></tbody>
        </table>
      </div>
      <div class="chord-table-actions">
        <button id="addChordBtn" type="button">+ Add chord</button>
        <button id="resetChordsBtn" type="button">Reset to defaults</button>
      </div>
    </div>
  </div>

  <div id="chordDisplay">
    <span class="placeholder">Chord detection coming soon</span>
  </div>

  <div id="pianoContainer">
    <svg id="piano"></svg>
  </div>

<script>
(function () {
  const WHITE_W = 40;
  const WHITE_H = 180;
  const BLACK_W = 24;
  const BLACK_H = 110;
  const LABEL_AREA_H = 40;
  const MIN_MIDI = 21;  // A0
  const MAX_MIDI = 108; // C8

  const SHARP_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const FLAT_NAMES  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];

  const LETTERS = ['C','D','E','F','G','A','B'];
  const NATURAL_PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const MAJOR_SCALE_STEPS = [0, 2, 4, 5, 7, 9, 11];

  // The 12 major keys. tonicLetter/tonicAccidental define the key signature;
  // fallback supplies names for the 5 non-diatonic (chromatic) pitch classes,
  // which don't have a single settled spelling the way scale tones do.
  const KEYS = [
    { name: 'C',  tonicLetter: 'C', tonicAccidental: 0,  fallback: SHARP_NAMES },
    { name: 'Db', tonicLetter: 'D', tonicAccidental: -1, fallback: FLAT_NAMES },
    { name: 'D',  tonicLetter: 'D', tonicAccidental: 0,  fallback: SHARP_NAMES },
    { name: 'Eb', tonicLetter: 'E', tonicAccidental: -1, fallback: FLAT_NAMES },
    { name: 'E',  tonicLetter: 'E', tonicAccidental: 0,  fallback: SHARP_NAMES },
    { name: 'F',  tonicLetter: 'F', tonicAccidental: 0,  fallback: FLAT_NAMES },
    { name: 'F#', tonicLetter: 'F', tonicAccidental: 1,  fallback: SHARP_NAMES },
    { name: 'G',  tonicLetter: 'G', tonicAccidental: 0,  fallback: SHARP_NAMES },
    { name: 'Ab', tonicLetter: 'A', tonicAccidental: -1, fallback: FLAT_NAMES },
    { name: 'A',  tonicLetter: 'A', tonicAccidental: 0,  fallback: SHARP_NAMES },
    { name: 'Bb', tonicLetter: 'B', tonicAccidental: -1, fallback: FLAT_NAMES },
    { name: 'B',  tonicLetter: 'B', tonicAccidental: 0,  fallback: SHARP_NAMES },
  ];

  // Builds the 12-entry note-name table for a key: the 7 diatonic scale
  // tones get their theoretically correct letter (e.g. E# in F# major,
  // not F), while the 5 chromatic pitch classes fall back to the key's
  // sharp/flat convention.
  function buildKeyNoteNames(key) {
    const names = key.fallback.slice();
    const tonicPc = (NATURAL_PC[key.tonicLetter] + key.tonicAccidental + 12) % 12;
    const letterIndex = LETTERS.indexOf(key.tonicLetter);
    MAJOR_SCALE_STEPS.forEach((step, degree) => {
      const letter = LETTERS[(letterIndex + degree) % 7];
      const expectedPc = (tonicPc + step) % 12;
      const accidental = ((expectedPc - NATURAL_PC[letter]) % 12 + 12) % 12;
      if (accidental === 0) names[expectedPc] = letter;
      else if (accidental === 1) names[expectedPc] = letter + '#';
      else if (accidental === 11) names[expectedPc] = letter + 'b';
      // Any other value would require a double sharp/flat, which none of
      // these 12 keys need.
    });
    return names;
  }

  let currentNoteNames = buildKeyNoteNames(KEYS[0]);

  const BLACK_PITCH_CLASSES = new Set([1, 3, 6, 8, 10]);

  function isBlackPitch(midi) {
    return BLACK_PITCH_CLASSES.has(midi % 12);
  }

  function noteName(midi) {
    return currentNoteNames[midi % 12];
  }

  function octaveOf(midi) {
    return Math.floor(midi / 12) - 1;
  }

  // ---- Chord detection ----
  // Each formula lists intervals (semitones) from the chord root.
  // Covers every chord family in chords.md: Major, Minor, Diminished,
  // Suspended, Augmented, and Dominant. Minor uses "-", diminished uses
  // "°"/"°7", half-diminished uses "ø7" (real jazz lead-sheet notation),
  // matching the project's earlier switch to "Δ" for major 7th.
  const DEFAULT_CHORD_FORMULAS = [
    // Major
    { symbol: '',            intervals: [0, 4, 7] },
    { symbol: 'add2',        intervals: [0, 2, 4, 7] },
    { symbol: '6',           intervals: [0, 4, 7, 9] },
    { symbol: 'Δ7',          intervals: [0, 4, 7, 11] },
    { symbol: 'Δ7(9)',       intervals: [0, 4, 7, 11, 2] },
    { symbol: 'Δ7(9, 13)',   intervals: [0, 4, 7, 11, 2, 9] },
    { symbol: 'Δ7#5',        intervals: [0, 4, 8, 11] },
    { symbol: 'Δ9#5',        intervals: [0, 4, 8, 11, 2] },
    { symbol: '6/9',         intervals: [0, 4, 7, 9, 2] },
    { symbol: '6/9#11',      intervals: [0, 4, 7, 9, 2, 6] },
    { symbol: 'Δ7#11',       intervals: [0, 4, 7, 11, 2, 6] },
    { symbol: 'Δ7#11#5',     intervals: [0, 4, 8, 11, 2, 6] },
    { symbol: 'Δ7(13, #11)', intervals: [0, 4, 7, 11, 2, 6, 9] },

    // Minor
    { symbol: '-',        intervals: [0, 3, 7] },
    { symbol: '-add2',    intervals: [0, 2, 3, 7] },
    { symbol: '-6',       intervals: [0, 3, 7, 9] },
    { symbol: '-7',       intervals: [0, 3, 7, 10] },
    { symbol: '-Δ7',      intervals: [0, 3, 7, 11] },
    { symbol: '-9',       intervals: [0, 3, 7, 10, 2] },
    { symbol: '-Δ9',      intervals: [0, 3, 7, 11, 2] },
    { symbol: '-6/9',     intervals: [0, 3, 7, 9, 2] },
    { symbol: '-6/9(11)', intervals: [0, 3, 7, 9, 2, 5] },
    { symbol: '-Δ7(13)',  intervals: [0, 3, 7, 11, 9] },
    { symbol: '-11',      intervals: [0, 2, 3, 5, 7, 10] },

    // Diminished
    { symbol: '°',  intervals: [0, 3, 6] },
    { symbol: 'ø7', intervals: [0, 3, 6, 10] },
    { symbol: '°7', intervals: [0, 3, 6, 9] },

    // Suspended
    { symbol: 'sus2',  intervals: [0, 2, 7] },
    { symbol: 'sus4',  intervals: [0, 5, 7] },
    { symbol: '7sus4', intervals: [0, 5, 7, 10] },
    { symbol: '13sus', intervals: [0, 5, 7, 10, 2, 9] },

    // Augmented
    { symbol: 'aug', intervals: [0, 4, 8] },

    // Dominant
    { symbol: '7',        intervals: [0, 4, 7, 10] },
    { symbol: '9',        intervals: [0, 4, 7, 10, 2] },
    { symbol: '9(add11)', intervals: [0, 4, 7, 10, 2, 5] },
    { symbol: '13',       intervals: [0, 4, 7, 10, 2, 9] },
    { symbol: '7+5',      intervals: [0, 4, 8, 10] },
    { symbol: '7b5',      intervals: [0, 4, 6, 10] },
    { symbol: '7b9',      intervals: [0, 4, 7, 10, 1] },
    { symbol: '7#9',      intervals: [0, 4, 7, 10, 3] },
    { symbol: '7#9#5',    intervals: [0, 4, 8, 10, 3] },
    { symbol: '7b9#5',    intervals: [0, 4, 8, 10, 1] },
    { symbol: '7#11b9',   intervals: [0, 4, 7, 10, 1, 6] },
    { symbol: '13b9',     intervals: [0, 4, 7, 10, 1, 9] },
    { symbol: '13#11',    intervals: [0, 4, 7, 10, 2, 6, 9] },
  ];

  // ---- Chord table persistence (cookie) ----
  function getCookie(name) {
    const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return match ? decodeURIComponent(match[1]) : null;
  }
  function setCookie(name, value, days) {
    document.cookie = name + '=' + encodeURIComponent(value) +
      '; path=/; max-age=' + (days * 24 * 60 * 60) + '; SameSite=Lax';
  }
  function deleteCookie(name) {
    document.cookie = name + '=; path=/; max-age=0';
  }

  function cloneDefaultChordFormulas() {
    return DEFAULT_CHORD_FORMULAS.map(f => ({ symbol: f.symbol, intervals: f.intervals.slice() }));
  }

  function loadChordFormulas() {
    const raw = getCookie('chordFormulas');
    if (!raw) return cloneDefaultChordFormulas();
    try {
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) throw new Error('not an array');
      return parsed.map(f => ({
        symbol: String(f.symbol || ''),
        intervals: Array.isArray(f.intervals)
          ? Array.from(new Set(f.intervals.map(n => ((Number(n) % 12) + 12) % 12).filter(n => !Number.isNaN(n))))
          : [],
      }));
    } catch (e) {
      return cloneDefaultChordFormulas();
    }
  }

  function saveChordFormulas() {
    setCookie('chordFormulas', JSON.stringify(chordFormulas), 365);
  }

  let chordFormulas = loadChordFormulas();

  // Finds every (root, formula) pair whose notes exactly match the given
  // set of pitch classes (order-independent, octave-independent).
  function detectChords(pitchClasses) {
    if (pitchClasses.length < 3) return [];
    const pcSet = new Set(pitchClasses);
    const matches = [];
    pitchClasses.forEach(root => {
      chordFormulas.forEach(formula => {
        if (formula.intervals.length !== pitchClasses.length) return;
        const expected = formula.intervals.map(i => (root + i) % 12);
        if (expected.every(pc => pcSet.has(pc))) {
          matches.push({ root, formula });
        }
      });
    });
    return matches;
  }

  function chordLabel(match) {
    return currentNoteNames[match.root] + match.formula.symbol;
  }

  // Name of the interval between two notes, indexed by semitone distance mod 12.
  const INTERVAL_NAMES = [
    'Octave',      // 0
    'Minor 2nd',   // 1
    'Major 2nd',   // 2
    'Minor 3rd',   // 3
    'Major 3rd',   // 4
    'Perfect 4th', // 5
    'Tritone',     // 6
    'Perfect 5th', // 7
    'Minor 6th',   // 8
    'Major 6th',   // 9
    'Minor 7th',   // 10
    'Major 7th',   // 11
  ];

  function updateChordDisplay(activeMidiSorted, pitchClasses) {
    const el = document.getElementById('chordDisplay');
    el.innerHTML = '';

    if (activeMidiSorted.length === 0) {
      el.innerHTML = '<span class="placeholder">Play some notes&hellip;</span>';
      return;
    }
    if (activeMidiSorted.length === 1) {
      const main = document.createElement('div');
      main.className = 'chord-main';
      main.textContent = noteName(activeMidiSorted[0]);
      el.appendChild(main);
      return;
    }
    if (activeMidiSorted.length === 2) {
      const distance = activeMidiSorted[1] - activeMidiSorted[0];
      const main = document.createElement('div');
      main.className = 'chord-main';
      main.textContent = INTERVAL_NAMES[distance % 12];
      el.appendChild(main);

      const alt = document.createElement('div');
      alt.className = 'chord-alt';
      alt.textContent = noteName(activeMidiSorted[0]) + '  →  ' + noteName(activeMidiSorted[1]);
      el.appendChild(alt);
      return;
    }

    const bassPc = activeMidiSorted[0] % 12;
    const matches = detectChords(pitchClasses);
    const primary = matches.find(m => m.root === bassPc) || matches[0];

    const main = document.createElement('div');
    main.className = 'chord-main';
    if (primary) {
      let text = chordLabel(primary);
      if (primary.root !== bassPc) {
        text += '/' + currentNoteNames[bassPc];
      }
      main.textContent = text;
    } else {
      main.textContent = currentNoteNames[bassPc] + ' n.c.';
    }
    el.appendChild(main);

    const others = matches.filter(m => m !== primary);
    if (others.length > 0) {
      const alt = document.createElement('div');
      alt.className = 'chord-alt';
      alt.textContent = others.map(chordLabel).join('  /  ');
      el.appendChild(alt);
    }
  }

  function buildKeys(minMidi, maxMidi) {
    const whiteX = {};
    let whiteIndex = 0;
    for (let m = minMidi; m <= maxMidi; m++) {
      if (!isBlackPitch(m)) {
        whiteX[m] = whiteIndex * WHITE_W;
        whiteIndex++;
      }
    }
    const totalWhiteWidth = whiteIndex * WHITE_W;

    const keys = [];
    for (let m = minMidi; m <= maxMidi; m++) {
      if (!isBlackPitch(m)) {
        keys.push({ midi: m, isBlack: false, x: whiteX[m], width: WHITE_W, height: WHITE_H });
      } else {
        const nextWhite = whiteX[m + 1];
        const prevWhite = whiteX[m - 1];
        const boundary = (nextWhite !== undefined) ? nextWhite : (prevWhite + WHITE_W);
        keys.push({ midi: m, isBlack: true, x: boundary - BLACK_W / 2, width: BLACK_W, height: BLACK_H });
      }
    }
    return { keys, totalWhiteWidth };
  }

  const { keys, totalWhiteWidth } = buildKeys(MIN_MIDI, MAX_MIDI);
  const svgWidth = totalWhiteWidth;
  const svgHeight = LABEL_AREA_H + WHITE_H;

  const svg = document.getElementById('piano');
  svg.setAttribute('width', svgWidth);
  svg.setAttribute('height', svgHeight);
  svg.setAttribute('viewBox', `0 0 ${svgWidth} ${svgHeight}`);

  const rectByMidi = new Map();
  const labelGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  const keyGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  const octaveGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');

  function makeRect(key) {
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', key.x);
    rect.setAttribute('y', LABEL_AREA_H);
    rect.setAttribute('width', key.width);
    rect.setAttribute('height', key.height);
    rect.setAttribute('class', key.isBlack ? 'black-key' : 'white-key');
    rect.dataset.midi = key.midi;
    return rect;
  }

  // white keys first so black keys render on top
  keys.filter(k => !k.isBlack).forEach(key => {
    const rect = makeRect(key);
    keyGroup.appendChild(rect);
    rectByMidi.set(key.midi, rect);

    if (key.midi % 12 === 0) { // C key: label octave
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', key.x + key.width / 2);
      text.setAttribute('y', LABEL_AREA_H + WHITE_H - 8);
      text.setAttribute('class', 'octave-label');
      text.textContent = 'C' + octaveOf(key.midi);
      octaveGroup.appendChild(text);
    }
  });
  keys.filter(k => k.isBlack).forEach(key => {
    const rect = makeRect(key);
    keyGroup.appendChild(rect);
    rectByMidi.set(key.midi, rect);
  });

  svg.appendChild(keyGroup);
  svg.appendChild(octaveGroup);
  svg.appendChild(labelGroup);

  const activeNotes = new Set();

  function render() {
    rectByMidi.forEach((rect, midi) => {
      const base = rect.classList.contains('black-key') ? 'black-key' : 'white-key';
      rect.setAttribute('class', base + (activeNotes.has(midi) ? ' active' : ''));
    });

    while (labelGroup.firstChild) labelGroup.removeChild(labelGroup.firstChild);
    activeNotes.forEach(midi => {
      const key = keys.find(k => k.midi === midi);
      if (!key) return;
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      const cx = key.x + key.width / 2;
      text.setAttribute('x', cx);
      text.setAttribute('y', LABEL_AREA_H - 12);
      text.setAttribute('class', 'note-label');
      text.textContent = noteName(midi);
      labelGroup.appendChild(text);
    });

    const activeMidiSorted = Array.from(activeNotes).sort((a, b) => a - b);
    const pitchClasses = Array.from(new Set(activeMidiSorted.map(m => m % 12)));
    updateChordDisplay(activeMidiSorted, pitchClasses);
  }

  // ---- Key selection ----
  const keySelect = document.getElementById('keySelect');
  KEYS.forEach((key, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = key.name;
    keySelect.appendChild(opt);
  });
  keySelect.addEventListener('change', () => {
    currentNoteNames = buildKeyNoteNames(KEYS[Number(keySelect.value)]);
    render();
  });

  // ---- Chord table editor ----
  const chordTableBody = document.getElementById('chordTableBody');

  function parseIntervals(text) {
    return Array.from(new Set(
      text.split(',')
        .map(s => parseInt(s.trim(), 10))
        .filter(n => !Number.isNaN(n))
        .map(n => ((n % 12) + 12) % 12)
    ));
  }

  function renderChordTable() {
    chordTableBody.innerHTML = '';
    chordFormulas.forEach((formula, index) => {
      const row = document.createElement('tr');

      const symbolCell = document.createElement('td');
      const symbolInput = document.createElement('input');
      symbolInput.type = 'text';
      symbolInput.value = formula.symbol;
      symbolInput.addEventListener('change', () => {
        chordFormulas[index].symbol = symbolInput.value;
        saveChordFormulas();
        render();
      });
      symbolCell.appendChild(symbolInput);

      const intervalsCell = document.createElement('td');
      const intervalsInput = document.createElement('input');
      intervalsInput.type = 'text';
      intervalsInput.value = formula.intervals.join(',');
      intervalsInput.addEventListener('change', () => {
        chordFormulas[index].intervals = parseIntervals(intervalsInput.value);
        intervalsInput.value = chordFormulas[index].intervals.join(',');
        saveChordFormulas();
        render();
      });
      intervalsCell.appendChild(intervalsInput);

      const deleteCell = document.createElement('td');
      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.className = 'chord-delete-btn';
      deleteBtn.textContent = '✕';
      deleteBtn.setAttribute('aria-label', 'Delete chord');
      deleteBtn.addEventListener('click', () => {
        chordFormulas.splice(index, 1);
        saveChordFormulas();
        renderChordTable();
        render();
      });
      deleteCell.appendChild(deleteBtn);

      row.appendChild(symbolCell);
      row.appendChild(intervalsCell);
      row.appendChild(deleteCell);
      chordTableBody.appendChild(row);
    });
  }

  document.getElementById('addChordBtn').addEventListener('click', () => {
    chordFormulas.push({ symbol: '', intervals: [] });
    renderChordTable();
  });

  document.getElementById('resetChordsBtn').addEventListener('click', () => {
    chordFormulas = cloneDefaultChordFormulas();
    deleteCookie('chordFormulas');
    renderChordTable();
    render();
  });

  renderChordTable();

  // ---- Settings popup ----
  const menuButton = document.getElementById('menuButton');
  const settingsPanel = document.getElementById('settingsPanel');

  function setSettingsOpen(open) {
    settingsPanel.hidden = !open;
    menuButton.setAttribute('aria-expanded', String(open));
  }

  menuButton.addEventListener('click', e => {
    e.stopPropagation();
    setSettingsOpen(settingsPanel.hidden);
  });
  settingsPanel.addEventListener('click', e => e.stopPropagation());
  document.addEventListener('click', () => setSettingsOpen(false));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') setSettingsOpen(false);
  });

  function noteOn(midi) {
    activeNotes.add(midi);
    render();
  }
  function noteOff(midi) {
    activeNotes.delete(midi);
    render();
  }

  // Mouse/touch interaction for testing without hardware
  let mouseDown = false;
  document.addEventListener('mousedown', () => mouseDown = true);
  document.addEventListener('mouseup', () => mouseDown = false);
  keyGroup.addEventListener('mousedown', e => {
    const midi = e.target.dataset.midi;
    if (midi !== undefined) noteOn(Number(midi));
  });
  keyGroup.addEventListener('mouseup', e => {
    const midi = e.target.dataset.midi;
    if (midi !== undefined) noteOff(Number(midi));
  });
  keyGroup.addEventListener('mouseleave', e => {
    const midi = e.target.dataset && e.target.dataset.midi;
    if (midi !== undefined) noteOff(Number(midi));
  }, true);
  keyGroup.addEventListener('mouseenter', e => {
    if (mouseDown) {
      const midi = e.target.dataset && e.target.dataset.midi;
      if (midi !== undefined) noteOn(Number(midi));
    }
  }, true);

  render();

  // Center the keyboard roughly on middle C on load
  const container = document.getElementById('pianoContainer');
  const middleCX = (rectByMidi.get(60) || {}).getAttribute
    ? Number(rectByMidi.get(60).getAttribute('x'))
    : 0;
  container.scrollLeft = Math.max(0, middleCX - container.clientWidth / 2);

  // ---- Web MIDI setup ----
  const statusEl = document.getElementById('status');
  const inputSelect = document.getElementById('inputSelect');
  const inputRow = document.getElementById('inputRow');
  const attachedInputs = new Set();

  function handleMIDIMessage(event) {
    const [status, data1, data2] = event.data;
    const command = status & 0xf0;
    if (command === 0x90 && data2 > 0) {
      noteOn(data1);
    } else if (command === 0x80 || (command === 0x90 && data2 === 0)) {
      noteOff(data1);
    }
  }

  function attachInput(input) {
    if (attachedInputs.has(input.id)) return;
    input.onmidimessage = handleMIDIMessage;
    attachedInputs.add(input.id);
  }

  function refreshInputList(access) {
    inputSelect.innerHTML = '';
    const inputs = Array.from(access.inputs.values());
    if (inputs.length === 0) {
      statusEl.textContent = 'No MIDI devices found. Connect a device.';
      statusEl.className = '';
      inputRow.style.display = 'none';
      return;
    }
    inputRow.style.display = '';
    inputs.forEach(input => {
      const opt = document.createElement('option');
      opt.value = input.id;
      opt.textContent = input.name || input.id;
      inputSelect.appendChild(opt);
      attachInput(input);
    });
    statusEl.textContent = `Connected: listening to ${inputs.length} device(s)`;
    statusEl.className = 'connected';
  }

  if (!navigator.requestMIDIAccess) {
    statusEl.textContent = 'Web MIDI API not supported in this browser. Use Chrome or Edge.';
    statusEl.className = 'error';
  } else {
    navigator.requestMIDIAccess().then(access => {
      refreshInputList(access);
      access.onstatechange = () => refreshInputList(access);
    }).catch(err => {
      statusEl.textContent = 'MIDI access denied or unavailable: ' + err.message;
      statusEl.className = 'error';
    });
  }
})();
</script>
</body>
</html>
