<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIDI Piano</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #ffffff;
    color: #222;
  }
  #topBar {
    position: relative;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    border-bottom: 1px solid #eee;
    flex-wrap: wrap;
  }
  #status {
    font-size: 13px;
    color: #666;
  }
  #status.connected { color: #2a7a2a; }
  #status.error { color: #b33; }
  #inputRow {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
  }
  select {
    font-size: 13px;
    padding: 4px 8px;
  }
  #menuButton {
    margin-left: auto;
    width: 32px;
    height: 32px;
    font-size: 18px;
    line-height: 1;
    background: none;
    border: 1px solid #ddd;
    border-radius: 4px;
    cursor: pointer;
    color: #333;
  }
  #menuButton:hover {
    background: #f5f5f5;
  }
  #settingsPanel {
    position: absolute;
    top: 100%;
    margin-top: 6px;
    right: 16px;
    width: 380px;
    max-width: calc(100vw - 32px);
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 10;
    font-size: 13px;
  }
  #settingsPanel[hidden] {
    display: none;
  }
  #settingsPanel label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  #settingsPanel h4 {
    margin: 6px 0 0;
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .level-control {
    display: flex;
    border: 1px solid #ddd;
    border-radius: 4px;
    overflow: hidden;
  }
  .level-btn {
    flex: 1;
    padding: 5px 0;
    font-size: 12px;
    border: none;
    background: #fff;
    cursor: pointer;
    color: #555;
  }
  .level-btn + .level-btn {
    border-left: 1px solid #ddd;
  }
  .level-btn:hover {
    background: #f5f5f5;
  }
  .level-btn.active {
    background: #4a76c4;
    color: #fff;
  }
  #chordsSection {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #chordsSection[hidden] {
    display: none;
  }
  #chordTableWrap {
    max-height: 320px;
    overflow-y: auto;
    border: 1px solid #eee;
    border-radius: 4px;
  }
  #chordTable {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  #chordTable th, #chordTable td {
    padding: 3px 5px;
    text-align: left;
    border-bottom: 1px solid #f2f2f2;
  }
  #chordTable th {
    position: sticky;
    top: 0;
    background: #fafafa;
    color: #888;
    font-weight: 500;
  }
  #chordTable td:first-child { width: 40%; }
  #chordTable input {
    width: 100%;
    box-sizing: border-box;
    font-size: 12px;
    padding: 2px 4px;
    border: 1px solid #ddd;
    border-radius: 3px;
  }
  #chordTable .chord-delete-btn {
    background: none;
    border: none;
    color: #b33;
    cursor: pointer;
    font-size: 13px;
    padding: 0 4px;
  }
  .chord-table-actions {
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .chord-table-actions button {
    font-size: 12px;
    padding: 5px 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
  }
  .chord-table-actions button:hover {
    background: #f5f5f5;
  }
  .chord-import-error {
    color: #b33;
    font-size: 12px;
  }
  .version-info {
    color: #bbb;
    font-size: 11px;
    text-align: right;
  }
  #chordDisplay {
    min-height: 90px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 8px 24px;
  }
  #chordDisplay .placeholder {
    color: #bbb;
    font-size: 14px;
  }
  #chordDisplay .chord-main {
    font-size: 40px;
    font-weight: 600;
    line-height: 1.1;
  }
  #chordDisplay .chord-alt {
    font-size: 15px;
    color: #888;
    margin-top: 4px;
  }
  #pianoContainer {
    overflow-x: auto;
    padding: 0 16px 24px 16px;
  }
  svg#piano {
    display: block;
  }
  .white-key {
    fill: #ffffff;
    stroke: #333;
    stroke-width: 1;
  }
  .white-key.active {
    fill: #a9c9f0;
  }
  .black-key {
    fill: #222222;
    stroke: #000;
    stroke-width: 1;
  }
  .black-key.active {
    fill: #4a76c4;
  }
  .note-label {
    font-size: 15px;
    fill: #333;
    text-anchor: middle;
    font-weight: 600;
  }
  .octave-label {
    font-size: 10px;
    fill: #999;
    text-anchor: middle;
  }
</style>
</head>
<body>
  <div id="topBar">
    <strong>MIDI Piano</strong>
    <span id="status">Checking for Web MIDI support&hellip;</span>
    <label for="inputSelect" id="inputRow" style="display:none;"><select id="inputSelect"></select></label>
    <button id="menuButton" type="button" aria-label="Settings" aria-haspopup="true" aria-expanded="false">&#9776;</button>
    <div id="settingsPanel" hidden>
      <div class="level-control" role="group" aria-label="Level">
        <button type="button" class="level-btn" data-level="basic">Basic</button>
        <button type="button" class="level-btn" data-level="intermediate">Intermediate</button>
        <button type="button" class="level-btn" data-level="nerd">Nerd</button>
      </div>

      <label for="keySelect">Key <select id="keySelect"></select></label>
      <label for="modeSelect"><span id="modeLabelText">Mode</span> <select id="modeSelect"></select></label>
      <label for="debugCheckbox">Debug <input type="checkbox" id="debugCheckbox"></label>

      <div id="chordsSection">
        <h4>Chords</h4>
        <div id="chordTableWrap">
          <table id="chordTable">
            <thead>
              <tr><th>Symbol</th><th>Intervals</th><th></th></tr>
            </thead>
            <tbody id="chordTableBody"></tbody>
          </table>
        </div>
        <div class="chord-table-actions">
          <button id="addChordBtn" type="button">+ Add chord</button>
          <button id="resetChordsBtn" type="button">Reset to defaults</button>
        </div>
        <div class="chord-table-actions">
          <button id="exportChordsBtn" type="button">Export&hellip;</button>
          <button id="importChordsBtn" type="button">Import&hellip;</button>
          <input id="importFileInput" type="file" accept="application/json" style="display:none;">
        </div>
        <div id="chordImportError" class="chord-import-error" hidden></div>
      </div>

      <div id="versionInfo" class="version-info"></div>
    </div>
  </div>

  <div id="chordDisplay">
    <span class="placeholder">Chord detection coming soon</span>
  </div>

  <div id="pianoContainer">
    <svg id="piano"></svg>
  </div>

<script src="app.js?v=3d69c36"></script>
</body>
</html>
